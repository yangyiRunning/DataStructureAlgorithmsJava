<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据结构与算法 · 动画演示</title>
  <meta name="theme-color" content="#FEFDFB">
  <link rel="stylesheet" href="./assets/app.css?v=20261121b">
</head>

<body>
  <header class="topbar">
    <!-- 只有在主站的 /dsa/ 下才显示：单独打开这个站时，根路径没有"主站"可回 -->
    <a class="back-home" id="back-home" href="/" hidden>← 回主站</a>
    <div class="topbar-row">
      <div class="brand">
        <!-- 标志沿用主站：一张纸 + 一盏灯。白天是日光下的暖纸，
             夜里是关掉大灯留一盏暖灯。和 personal-site 的 SiteNav 同一个画法。 -->
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2.6" y="7.4" width="14.6" height="14" rx="3.6"
                fill="none" stroke="currentColor" stroke-width="1.7"/>
          <circle cx="17.7" cy="7" r="4.1"
                  fill="var(--brand)" stroke="var(--cream)" stroke-width="1.7"/>
        </svg>
        <h1>数据结构与算法</h1>
        <span class="badge">动画演示</span>
      </div>
      <div class="topbar-tools">
        <a class="icon-link" href="https://github.com/yangyiRunning/DataStructureAlgorithmsJava"
           target="_blank" rel="noopener" aria-label="在 GitHub 上看源码" title="在 GitHub 上看源码">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.58 2 12.23c0 4.52 2.87 8.35 6.84 9.7.5.1.68-.22.68-.49 0-.24-.01-1.05-.01-1.9-2.78.62-3.37-1.2-3.37-1.2-.45-1.18-1.11-1.5-1.11-1.5-.91-.63.07-.62.07-.62 1 .07 1.53 1.05 1.53 1.05.9 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.27 2.75 1.05a9.4 9.4 0 0 1 5 0c1.91-1.32 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.8-4.57 5.05.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.6.69.49A10.02 10.02 0 0 0 22 12.23C22 6.58 17.52 2 12 2Z"/>
          </svg>
        </a>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换到夜灯模式" title="切换到夜灯模式">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
               stroke-width="1.9" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.1"/>
            <path d="M12 2.6v2.1M12 19.3v2.1M2.6 12h2.1M19.3 12h2.1M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M18.7 5.3l-1.5 1.5M6.8 17.2l-1.5 1.5"/>
          </svg>
        </button>
      </div>
    </div>
    <p class="lede">
      每一步都是算法真实执行过的状态：执行时逐帧记录快照，页面只负责回放，不另画一套逻辑。
      演示用的算法与 <code>java/dsalab</code>（Java）、<code>python/dsalab.py</code>（Python）
      两套独立实现在同一批随机输入上做过三方对拍。
    </p>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <!-- 筛选框必须放在 #nav 外面：buildNav() 每次会清空 #nav 重建列表 -->
      <div class="nav-filter-wrap">
        <input id="nav-filter" type="search" placeholder="筛选演示…（如 kmeans、注意力、栈）"
               aria-label="筛选演示" autocomplete="off" spellcheck="false">
        <p class="nav-count" id="nav-count"></p>
      </div>
      <nav class="navlist" id="nav" aria-label="演示目录"></nav>
    </aside>

    <main class="stage">
      <div class="stage-head">
        <h2 id="title">载入中…</h2>
        <p id="brief"></p>
        <dl class="facts" id="facts"></dl>
      </div>

      <div class="canvas-wrap">
        <svg id="view" viewBox="0 0 900 380" preserveAspectRatio="xMidYMid meet" role="img"
          aria-label="算法状态可视化"></svg>
      </div>

      <div class="controls">
        <div class="transport">
          <button type="button" id="btn-first" title="回到第一步（Home）" aria-label="回到第一步">⏮</button>
          <button type="button" id="btn-prev" title="上一步（←）" aria-label="上一步">◀</button>
          <button type="button" id="btn-play" class="primary" title="播放 / 暂停（空格）" aria-label="播放或暂停">▶</button>
          <button type="button" id="btn-next" title="下一步（→）" aria-label="下一步">▶|</button>
          <button type="button" id="btn-last" title="到最后一步（End）" aria-label="到最后一步">⏭</button>
        </div>

        <div class="scrub">
          <input type="range" id="scrub" min="0" max="0" value="0" step="1" aria-label="进度">
          <output id="progress">0 / 0</output>
        </div>

        <label class="speed">
          速度
          <input type="range" id="speed" min="1" max="30" value="8" step="1" aria-label="播放速度">
          <output id="speed-out">8 步/秒</output>
        </label>
      </div>

      <p class="note" id="note"></p>

      <div class="inputs">
        <span class="inputs-label">换一组输入</span>
        <div id="input-buttons"></div>
      </div>
    </main>

    <aside class="code-pane">
      <div class="code-head">
        <div class="lang-switch" id="lang-switch">
          <button type="button" data-lang="js" aria-pressed="true">JS</button>
          <button type="button" data-lang="py" aria-pressed="false">Python</button>
        </div>
        <span id="line-no" class="line-no">—</span>
      </div>
      <pre id="code" aria-label="算法代码"></pre>
      <div class="counters" id="counters"></div>
      <details class="legend">
        <summary>图例</summary>
        <ul id="legend"></ul>
      </details>
    </aside>
  </div>

  <script type="module" src="./app.js?v=20261121b"></script>
</body>

</html>
